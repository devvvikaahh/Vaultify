<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultify - Secure Password Manager</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        .password-list {
            margin-top: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .password-item {
            background-color: var(--bg-color);
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginSection">
            <h2>Vaultify</h2>
            <p class="subtitle">Your Secure Password Manager</p>
            
            <div class="form-group">
                <label for="masterPassword">Master Password</label>
                <input type="password" id="masterPassword" placeholder="Enter your master password">
            </div>
            
            <button id="unlockBtn">Unlock Vault</button>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboardSection" class="hidden">
            <h2>Vaultify Dashboard</h2>
            <p class="subtitle">Manage Your Encrypted Passwords</p>
            
            <div class="form-group">
                <label for="siteName">Service / Website</label>
                <input type="text" id="siteName" placeholder="e.g., Gmail, GitHub">
            </div>

            <div class="form-group">
                <label for="sitePassword">Password</label>
                <input type="password" id="sitePassword" placeholder="Enter password to encrypt">
            </div>
            
            <button id="saveBtn">Save Password</button>

            <div class="password-list" id="passwordList">
                <!-- Saved items will appear here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
